<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipwise: paste a link, get viral clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--ink:#14213d;--muted:#5b6785;--accent:#2f5bff;--line:#d3d9e6;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10162a;--ink:#eef1f8;--muted:#9aa5c4;--accent:#6c8aff;--line:#2a3354;--surface:#182040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
p.sub{color:var(--muted);margin:0 0 28px;max-width:46ch}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=url]{flex:1 1 260px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
button{padding:14px 22px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 1rem inherit;font-family:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts{display:flex;gap:18px;align-items:center;margin:14px 0 0;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.opts select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#status{margin:28px 0 0;font-weight:600;min-height:1.5em}
#status.err{color:#c62828}
#results{display:grid;gap:28px;margin-top:20px}
.clip{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.clip video{width:150px;aspect-ratio:9/16;background:#000;border-radius:10px;object-fit:cover}
.clip.wide{grid-template-columns:1fr}
.clip.wide video{width:100%;aspect-ratio:16/9}
.clip h3{margin:0 0 4px;font-size:1.15rem}
.clip p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.clip a{color:var(--accent);font-weight:600}
.score{font-weight:800;font-size:1.4rem}
@media (max-width:480px){.clip{grid-template-columns:110px 1fr}.clip video{width:110px}}
</style>
</head>
<body>
<main>
  <h1>Paste a link. Get the clips worth posting.</h1>
  <p class="sub">The AI watches the video, finds the moments most likely to take off, and cuts them for you.</p>
  <div class="row">
    <input id="url" type="url" placeholder="https://youtube.com/watch?v=..." aria-label="Video link">
    <button id="go">Find clips</button>
  </div>
  <div class="opts">
    <label>Or upload a video <input type="file" id="file" accept="video/*,audio/*"></label>
  </div>
  <div class="opts">
    <label>Clips <select id="n"><option>3</option><option selected>5</option><option>8</option></select></label>
    <label><input type="checkbox" id="vert" checked> Vertical 9:16</label>
  </div>
  <div id="status" role="status"></div>
  <div id="results"></div>
</main>
<script>
const API = ""; // same server serves the site and the API
const $ = id => document.getElementById(id);
let timer;

$("go").onclick = async () => {
  const url = $("url").value.trim();
  const file = $("file").files[0];
  if (!url && !file) return setStatus("Paste a video link or choose a file.", true);
  $("results").innerHTML = "";
  $("go").disabled = true;
  setStatus("Starting…");
  try {
    let r;
    if (file) {
      setStatus("Uploading…");
      const fd = new FormData();
      fd.append("file", file);
      fd.append("max_clips", $("n").value);
      fd.append("vertical", $("vert").checked);
      r = await fetch(API + "/api/upload", {method: "POST", body: fd});
    } else {
      r = await fetch(API + "/api/clips", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({url, max_clips: +$("n").value, vertical: $("vert").checked})
      });
    }
    const {job_id} = await r.json();
    poll(job_id);
  } catch (e) {
    fail("Can't reach the server. Check that the backend is running.");
  }
};

function poll(id) {
  clearInterval(timer);
  timer = setInterval(async () => {
    try {
      const j = await (await fetch(API + "/api/jobs/" + id)).json();
      if (j.status === "error") return fail(j.error || "Something went wrong.");
      if (j.status === "done") {
        clearInterval(timer);
        $("go").disabled = false;
        setStatus(j.clips.length ? `Found ${j.clips.length} clips.` : "No strong clips found in this video.");
        render(j.clips);
      } else setStatus(j.status + "…");
    } catch (e) { fail("Lost connection to the server."); }
  }, 2500);
}

function render(clips) {
  const wide = !$("vert").checked;
  $("results").innerHTML = clips.map(c => `
    <article class="clip ${wide ? "wide" : ""}">
      <video src="${API + c.file}" controls preload="metadata"></video>
      <div>
        <div class="score">${c.score ?? ""}</div>
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.reason)}</p>
        <a href="${API + c.file}" download>Download clip</a>
      </div>
    </article>`).join("");
}

function fail(msg) { clearInterval(timer); $("go").disabled = false; setStatus(msg, true); }
function setStatus(t, err) { $("status").textContent = t; $("status").className = err ? "err" : ""; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
</script>
</body>
</html>
